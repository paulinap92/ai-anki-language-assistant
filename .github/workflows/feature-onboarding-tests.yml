name: Feature onboarding tests

on:
  push:
    branches:
      - feature/easy-onboarding-v13.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Compile changed Python
        run: python -m compileall -q src/core/user_setup.py src/ui/modern_gui.py

      - name: Run onboarding regression tests
        run: python -m pytest -q tests/core/test_user_setup.py tests/ui/test_v12_2_setup_ux.py
