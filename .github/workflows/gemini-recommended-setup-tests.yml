name: Gemini recommended setup tests

on:
  push:
    branches:
      - feature/gemini-recommended-setup-v13.2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Compile source
        run: python -m compileall -q src
      - name: Run setup regression tests
        run: python -m pytest -q tests/core/test_user_setup.py tests/ui/test_v12_2_setup_ux.py
