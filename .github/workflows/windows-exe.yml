name: Windows EXE test build

on:
  push:
    branches:
      - feature/windows-exe-packaging-v13.2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Build Windows package
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Smoke-test packaged EXE
        shell: pwsh
        run: ./scripts/smoke_test_windows.ps1

      - name: Upload Windows ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AI-Anki-Language-Assistant-Windows
          path: dist/AI-Anki-Language-Assistant-Windows.zip
          if-no-files-found: error
          retention-days: 14
